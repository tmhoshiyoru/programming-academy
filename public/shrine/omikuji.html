</style></head><body><main class="wrap"><header class="mast"><div class="eyebrow">網路釣魚防詐・互動御神籤</div><h1>綠園神社</h1><p>一竿釣起好運，一籤識破詐騙。</p><div class="line"></div></header><section class="scene" id="scene" aria-label="釣魚抽籤動畫"><div class="torii" aria-hidden="true"><svg viewBox="0 0 280 230" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="toriiRed" x1="0" x2="1"><stop stop-color="#6e241f"/><stop offset=".48" stop-color="#c84b35"/><stop offset="1" stop-color="#782923"/></linearGradient></defs><path d="M50 67 L50 220 M230 67 L230 220" stroke="url(#toriiRed)" stroke-width="17"/><path d="M21 48 Q140 64 259 48 L270 36 Q140 54 10 36 Z" fill="#261e23"/><path d="M24 63 Q140 77 256 63 L254 82 Q140 96 26 82 Z" fill="url(#toriiRed)"/><path d="M120 83 H160 V115 H120 Z" fill="#b83b2c"/><path d="M62 119 H218" stroke="#a7392d" stroke-width="10"/><path d="M50 203 H230" stroke="#261e23" stroke-width="3" opacity=".35"/></svg></div><div class="moon"></div><div class="wave"></div><div class="wave two"></div><div class="bubble"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="fishing-line"></div><div class="hook">◡</div><div class="fish"><svg viewBox="0 0 160 95" role="img" aria-label="朱紅色鯛魚"><path d="M48 46 7 13 13 76Z" fill="#a52e28" stroke="#f6cf9c" stroke-width="3"/><path d="M48 44Q65 7 105 13Q145 20 151 48Q145 80 103 84Q65 88 48 44Z" fill="#c94a35" stroke="#f6cf9c" stroke-width="3"/><path d="M76 20Q89 0 109 15L99 36Z" fill="#a52e28" stroke="#f6cf9c" stroke-width="2"/><path d="M83 72 105 90 115 75Z" fill="#a52e28" stroke="#f6cf9c" stroke-width="2"/><path d="M65 44q27-18 52 0M63 55q27-18 54 0M75 65q20-11 39 0" stroke="#f5b57c" stroke-width="2" fill="none" opacity=".8"/><circle cx="127" cy="37" r="6" fill="#241d20"/><circle cx="129" cy="35" r="2" fill="white"/><path d="M143 55q6 5 10 0" stroke="#742b27" stroke-width="2" fill="none"/></svg></div><div class="scene-label" id="sceneText">網海深處，靜候有緣之人</div></section><div class="controls"><button class="primary" id="draw" type="button">🎣 拋竿求籤</button></div><div class="status" id="status" role="status" aria-live="polite">誠心一念，釣起今日的御神籤</div><section class="result" id="result" aria-live="polite"><article class="paper"><div class="paper-inner"><header class="ticket-head"><div class="shrine-name">綠 園 御 神 籤 ・ <span id="ticketNumber"></span></div><div class="fortune" id="fortune"></div><div class="topic" id="topic"></div></header><div class="poem-panel"><div class="poem" id="poem"></div></div><section class="section"><h3>【 御 神 諭 】</h3><p id="oracle"></p></section><section class="section"><h3>【 五 運 指 引 】</h3><div class="five" id="five"></div></section><section class="section guide"><h3>【 開 運 之 道 】</h3><p id="good"></p><p id="bad"></p></section><section class="motto"><h3>【 今 日 御 守 語 】</h3><p id="motto"></p><div class="foot">一竿釣起好運，一籤識破詐騙。</div></section></div></article><div class="after-actions"><button class="secondary" id="explainBtn" aria-expanded="false" aria-controls="explain">解讀此籤</button><button class="secondary" id="again">再釣一籤</button></div><aside class="explain" id="explain"><h3>⛩ 解籤・綠園守護指引</h3><p id="meaning"></p><p><strong>開運行動：</strong><span id="meaningGood"></span></p><p><strong>需要避開：</strong><span id="meaningBad"></span></p><small>籤運僅供趣味體驗，遇到可疑訊息請先查證。</small></aside></section></main><script>
const DATA=[{"id":1,"fortune":"小吉","topic":"假防毒警告 · 警報莫慌","poem":["螢幕忽然報中毒","催裝軟體似催促","關閉頁面查系統","莫讓惡程入電腦"],"oracle":"此籤小吉，吉中有戒。假病毒警告可能誘導安裝惡意程式。凡事莫急，辨明來處，方可避開網海假餌。","five":["網址｜短鏈縮址，須辨真身","帳號｜重要帳戶，宜多防護","密碼｜不可重複，宜用管理器","訊息｜天降好禮，先看公告","財運｜交易付款，保留憑證"],"good":"宜｜使用系統內建或可信安全工具檢查","bad":"忌｜致電彈窗客服或下載陌生程式","motto":"「警報再響，也別亂安裝」","meaning":"彈出式「中毒警告」不一定來自真正的防毒軟體。不要依照頁面指示下載程式或致電陌生客服，應從系統內建或可信的安全工具檢查。"},{"id":2,"fortune":"中吉","topic":"假租屋 · 租屋防餌","poem":["美屋低租映眼前","未曾看屋要付錢","細查屋主權屬事","莫讓訂金化雲煙"],"oracle":"此籤中吉，細察則順。假租屋常以搶房為由要求先付訂金。凡事莫急，辨明來處，方可避開網海假餌。","five":["網址｜疑似假站，另尋正路","帳號｜異常登入，查明紀錄","密碼｜密碼若洩，速改為宜","訊息｜附件連結，先問來歷","財運｜費用未明，切勿急付"],"good":"宜｜核實屋況身分與合約","bad":"忌｜未確認房源先匯款","motto":"「房可慢慢找，訂金別亂繳」","meaning":"租屋廣告若用低價與限時搶房催促先匯訂金，可能是詐騙。應核對房屋與出租者身分，未確認前不要付款。"},{"id":3,"fortune":"大大吉","topic":"包裹簡訊 · 包裹慎收","poem":["包裹未達訊先來","小額補費莫忙開","物流官網尋真跡","不教假餌入門來"],"oracle":"此籤上上，福運照網。假配送通知可能要求補繳費用。凡事莫急，辨明來處，方可避開網海假餌。","five":["網址｜陌生入口，核對網域","帳號｜登入之前，先查來源","密碼｜獨特長密，切勿外傳","訊息｜急催恐嚇，緩行求證","財運｜付款轉帳，查清對象"],"good":"宜｜使用官方物流查件頁面","bad":"忌｜輸入信用卡支付不明費用","motto":"「包裹可以等，卡號不能送」","meaning":"包裹未送達、補繳運費等簡訊可能夾帶釣魚連結。請從物流業者的官方網站或 App 查詢，勿直接填寫信用卡資訊。"},{"id":4,"fortune":"半吉","topic":"釣魚日曆 · 日程有疑","poem":["行事曆中邀請來","奇怪連結莫輕開","先查主辦真來歷","不讓假期變禍災"],"oracle":"此籤半吉，虛實須辨。陌生日曆邀請可能含惡意連結。凡事莫急，辨明來處，方可避開網海假餌。","five":["網址｜畫面相似，不等於真","帳號｜假登入頁，慎輸資料","密碼｜長密獨特，守住門戶","訊息｜不明來信，先驗真偽","財運｜低價誘惑，應查商家"],"good":"宜｜核實主辦者並刪除可疑邀請","bad":"忌｜開啟不明活動附帶網址","motto":"「行程要確認，連結不亂進」","meaning":"陌生日曆邀請也可能包含惡意網址。先確認邀請者與事件內容，不要因為行事曆提醒就直接點進連結。"},{"id":5,"fortune":"大吉","topic":"QR碼陷阱 · 方碼藏疑","poem":["方格碼中藏暗門","掃描之前問來源","網址跳轉先停步","細辨真身福自存"],"oracle":"此籤大吉，守正得安。不明QR碼可能導向假網站。凡事莫急，辨明來處，方可避開網海假餌。","five":["網址｜網址要辨，官方先行","帳號｜多重驗證，守護得吉","密碼｜驗證碼私藏，不可轉交","訊息｜熟人來訊，另途核實","財運｜小利誘惑，切莫貪心"],"good":"宜｜先檢查開啟的網址及來源","bad":"忌｜掃碼後立即付款登入","motto":"「掃碼不盲掃，安全不會少」","meaning":"QR 碼只是通往網址的入口，不能保證安全。掃描後先看清楚目的地，再決定是否登入或付款。"},{"id":6,"fortune":"吉","topic":"假訂閱續費 · 續費辨真","poem":["訂閱將停信忽來","付款更新莫忙開","官方帳單查明白","不讓假單奪錢財"],"oracle":"此籤主吉，謹慎為先。假訂閱續費郵件會索取付款資料。凡事莫急，辨明來處，方可避開網海假餌。","five": function chinese(n){if(n<10)return numerals[n];if(n===10)return '十';if(n<20)return '十'+(n%10?numerals[n%10]:'');let tens=Math.floor(n/10),ones=n%10;return numerals[tens]+'十'+(ones?numerals[ones]:'');}
function pick(){const arr=new Uint32Array(1);if(globalThis.crypto?.getRandomValues){crypto.getRandomValues(arr);return DATA[arr[0]%DATA.length]}return DATA[Math.floor(Math.random()*DATA.length)]}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function cast(){if(busy)return;busy=true;draw.disabled=true;result.classList.remove('visible');explain.classList.remove('visible');scene.classList.remove('caught','casting');void scene.offsetWidth;scene.classList.add('casting');txt('status','拋竿入海……尋覓今日的御神籤');$('sceneText').textContent='魚兒正在靠近……';await wait(1300);scene.classList.remove('casting');scene.classList.add('caught');txt('status','上鉤了！正在揭曉籤運');$('sceneText').textContent='一竿釣起好運';await wait(1500);render(pick());txt('status','御神籤已揭曉');draw.disabled=false;busy=false;scheduleEmbedHeight();}

function reportEmbedHeight(){const height=Math.ceil(Math.max(document.documentElement.scrollHeight,document.body.scrollHeight));window.parent.postMessage({type:'shrine-omikuji:resize',height},'*')}

embedHeightObserver.observe(document.documentElement);
embedHeightObserver.observe(document.body);
