<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173a3b">
  <title>綠園神社・拜殿</title>
  <style>
    :root{color-scheme:light;--ink:#30261e;--muted:#75654f;--red:#87352d;--gold:#d7b36b;--paper:#fbf5e8;--green:#335746;--line:#d8c49d;--sky:#15343c}
    *{box-sizing:border-box}[hidden]{display:none!important}html,body{width:100%;height:100%;min-height:100%;margin:0}body{overflow:hidden;color:var(--ink);background:#132f37;font-family:system-ui,"Noto Sans TC",sans-serif}button{font:inherit}button:focus-visible{outline:3px solid #2485ff;outline-offset:3px}
    .game{position:relative;width:100%;height:100dvh;min-height:min(520px,100dvh);overflow:hidden;background:linear-gradient(#173a43,#314b43 56%,#78684d)}
    .audio-tools{position:absolute;z-index:20;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));display:flex;gap:9px}.audio-toggle{display:grid;place-items:center;width:46px;height:46px;padding:0;color:#fff8e7;border:1px solid #fff8e788;border-radius:50%;background:#102b2bb0;backdrop-filter:blur(7px);cursor:pointer;box-shadow:0 3px 12px #071a1c55}.audio-toggle[aria-pressed="true"]{background:#a24d35c9}.audio-toggle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.audio-toggle .off-mark{display:none}.audio-toggle[aria-pressed="false"] .off-mark{display:block}
    .scene{position:absolute;inset:0;overflow:hidden;isolation:isolate;perspective:1250px;transform-style:preserve-3d;background:linear-gradient(180deg,#15363d 0%,#285052 53%,#425e48 54%,#526747 100%)}.scene:before{position:absolute;inset:0;z-index:0;content:"";opacity:.22;background-image:radial-gradient(#ead8a4 .7px,transparent 1px);background-size:27px 31px}.world{position:absolute;z-index:1;inset:0;overflow:hidden;perspective:1050px;transform-style:preserve-3d}.sky-glow{position:absolute;inset:0 0 43%;background:radial-gradient(ellipse at 50% 40%,#e3c78926,transparent 60%)}
    .shrine{position:absolute;top:7%;left:50%;width:min(48vw,610px);height:min(42vh,300px);min-height:195px;transform:translateX(-50%) translateZ(70px);transform-style:preserve-3d;filter:drop-shadow(0 12px 18px #0c211f77);transition:transform .5s ease}.shrine-roof{position:absolute;top:0;left:-5%;width:110%;height:27%;transform:translateZ(28px) rotateX(-5deg);transform-origin:bottom;background:linear-gradient(#342c26,#191e1e);clip-path:polygon(0 58%,15% 48%,22% 25%,40% 10%,50% 0,60% 10%,78% 25%,85% 48%,100% 58%,98% 82%,2% 82%)}.shrine-roof:after{position:absolute;inset:66% 8% 0;content:"";background:linear-gradient(#b78c4e,#5d3c2b)}.shrine-body{position:absolute;top:22%;left:12%;width:76%;height:69%;transform:translateZ(16px);transform-style:preserve-3d;border:8px solid #713b2c;background:linear-gradient(90deg,#842f29,#a54232 48%,#7e3029);box-shadow:inset 0 0 0 3px #cba660}.shrine-body:before{position:absolute;inset:11% 8%;content:"";border:2px solid #d0ae6d;background:repeating-linear-gradient(90deg,transparent 0 24%,#542f28 24.5% 26%,transparent 26.5% 49%)}.shrine-body:after{position:absolute;top:0;right:-21px;width:21px;height:100%;content:"";transform:skewY(-5deg);transform-origin:left;background:linear-gradient(90deg,#692c27,#3d2522);border-right:3px solid #c49a59}.shrine-curtain{position:absolute;top:23%;left:39%;width:22%;height:68%;transform:translateZ(25px);border:4px solid #63422d;background:repeating-linear-gradient(90deg,#d8c69b 0 5px,#563c2e 6px 9px);box-shadow:0 0 0 3px #d3ad68}.bell-rope{position:absolute;top:-7%;left:50%;width:4px;height:32%;transform:translateZ(32px);background:#d7b36b}.bell-rope:after{position:absolute;bottom:-8px;left:-11px;width:26px;height:10px;content:"";border-radius:50%;background:#d7b36b}
    .approach{position:absolute;top:44%;bottom:-9%;left:50%;width:min(62vw,780px);transform:translateX(-50%) perspective(900px) rotateX(31deg) translateZ(10px);transform-origin:top center;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);background:repeating-linear-gradient(0deg,#a99a78 0 4px,#c4b28a 5px 18px,#887a5f 19px 22px);box-shadow:inset 0 0 35px #352f2080;transition:transform .5s ease}.approach:after{position:absolute;inset:0 48%;content:"";opacity:.24;background:repeating-linear-gradient(0deg,#f3e6c2 0 2px,transparent 2px 30px)}.rail{position:absolute;top:48%;left:0;width:100%;height:8px;transform:translateZ(36px);background:#c5a36a;box-shadow:0 3px 8px #141d1a99}.garden{position:absolute;bottom:0;width:24%;height:46%;transform:translateZ(-40px);background:radial-gradient(ellipse at 50% 75%,#d2b25e 0 2px,transparent 3px),radial-gradient(ellipse at 25% 47%,#315940 0 14%,transparent 15%),radial-gradient(ellipse at 70% 45%,#294c3b 0 18%,transparent 19%);background-size:26px 31px,100% 100%,100% 100%;transition:transform .5s ease}.garden.left{left:0}.garden.right{right:0;transform:translateZ(-40px) scaleX(-1)}.lantern{position:absolute;top:54%;width:34px;height:45px;transform:translateZ(18px);border-radius:8px;background:linear-gradient(90deg,#71644e,#c1ac78 24%,#867657 75%,#574d3e);box-shadow:0 0 0 5px #6b6553,0 0 28px 9px #ffd68566;transition:transform .5s ease}.lantern:after{position:absolute;top:12px;left:8px;width:18px;height:20px;content:"";background:#ffd788;filter:blur(5px)}.lantern.one{left:19%}.lantern.two{right:19%;top:64%;transform:translateZ(12px) scale(.78)}
    .first-person{position:absolute;right:0;bottom:-5%;left:0;height:45%;pointer-events:none;transform-style:preserve-3d;z-index:4}.hands{position:absolute;bottom:0;left:50%;width:min(62vw,560px);height:100%;opacity:0;transform:translateX(-50%) translateZ(70px);transition:opacity .18s}.game.pose-clap .hands,.game.pose-pray .hands{opacity:1}.hand-art{position:absolute;bottom:0;display:block;width:46%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 12px #18252255);transition:transform .16s ease-out}.hand-art.left{left:0;object-position:right bottom;transform:translateX(-6%)}.hand-art.right{right:0;object-position:left bottom;transform:translateX(6%)}.game.clap-action .hand-art.left{animation:clap-left .5s cubic-bezier(.2,.8,.25,1)}.game.clap-action .hand-art.right{animation:clap-right .5s cubic-bezier(.2,.8,.25,1)}.game.pose-pray .hand-art.left{transform:translateX(17%)}.game.pose-pray .hand-art.right{transform:translateX(-17%)}.hands-pray{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;opacity:0;visibility:hidden;transform:translateY(8px) scale(.98);filter:drop-shadow(0 8px 12px #18252255);transition:opacity .2s ease,transform .2s ease,visibility .2s}.game.pose-pray .hand-art{opacity:0;visibility:hidden}.game.pose-pray .hands-pray{opacity:1;visibility:visible;transform:none}
    .top-caption{position:absolute;top:max(16px,env(safe-area-inset-top));left:50%;z-index:2;transform:translateX(-50%);color:#fff4d6;text-align:center;text-shadow:0 2px 6px #10252a;font-family:serif;letter-spacing:.15em;pointer-events:none}.top-caption small{display:block;color:#e3c88d;font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:.25em}.top-caption strong{display:block;margin-top:4px;font-size:clamp(1rem,3vw,1.4rem);font-weight:600}
    .wish-overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:#102522aa;backdrop-filter:blur(4px)}.wish-overlay[hidden]{display:none}.question-card{width:min(650px,100%);max-height:calc(100dvh - 40px);overflow:auto;padding:clamp(20px,4vw,36px);border:2px solid #c9a663;border-radius:22px;background:#fbf5e8f7;box-shadow:0 20px 70px #071614aa}.question-card h1{margin:0 0 8px;color:#7f302a;font-family:serif;font-size:clamp(1.55rem,4vw,2.2rem)}.question-card>p{margin:0 0 20px;color:#6b5c47;line-height:1.6}.question-step[hidden]{display:none}.question-step h2{margin:14px 0 12px;color:#3c4638;font-size:1.05rem}.answer-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.answer{min-height:54px;padding:11px 13px;text-align:left;color:#403327;border:1px solid #d3c19e;border-radius:12px;background:#fffdf8;cursor:pointer}.answer:hover,.answer[aria-pressed="true"]{border-color:#9b4937;background:#f7e8da;box-shadow:0 2px 0 #71302a}.quiz-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.quiz-progress{color:#887453;font-size:.8rem}.primary,.secondary{min-height:46px;padding:10px 20px;border:1px solid #d6b46e;border-radius:999px;font-weight:800;cursor:pointer}.primary{color:#fff8e9;background:linear-gradient(#9b4434,#713027);box-shadow:0 3px #51251e}.secondary{color:#553d28;background:#f8edcf}.primary:disabled{opacity:.45;cursor:not-allowed}.recommendation{margin:14px 0;padding:16px;border:1px solid #d6c39c;border-radius:14px;background:#fffaf0}.recommendation small{color:#92764b}.recommendation strong{display:block;margin-top:5px;color:#723129;font-size:1.15rem}.recommendation p{margin:.5rem 0 0;color:#62513c;line-height:1.55}
    .timing-ring{position:absolute;z-index:12;top:50%;left:50%;display:grid;place-items:center;width:clamp(126px,22vw,190px);aspect-ratio:1;transform:translate(-50%,-50%);border:5px solid #ffe9b1;border-radius:50%;background:#142e3766;box-shadow:0 5px 18px #06191e77,inset 0 0 0 1px #fff8d688;pointer-events:none}.timing-ring:before,.timing-ring:after{position:absolute;content:"";border-radius:50%}.timing-ring:before{inset:21%;border:4px solid #ffdc91;box-shadow:0 0 13px #ffc96688}.timing-ring:after{inset:36%;border:3px solid #fff4cf;box-shadow:0 0 10px #fff0c688}.shrinking-ring{position:absolute;width:88%;aspect-ratio:1;border:3px solid #fff1c8;border-radius:50%;background:#ffda7933;box-shadow:0 0 18px #ffd66e88}.ring-label{position:absolute;bottom:-31px;color:#fff3d7;font-size:.78rem;font-weight:700;text-shadow:0 2px 4px #14232a;white-space:nowrap}
    .instruction{position:absolute;z-index:11;top:20%;left:50%;width:min(500px,78vw);padding:12px 16px;transform:translateX(-50%);border:1px solid #dec58e;border-radius:15px;background:#fff8e9ed;color:#4a3a2b;text-align:center;font-size:clamp(.9rem,2vw,1.1rem);box-shadow:0 6px 20px #10252266}.game.pose-pray .instruction{background:#fff8e9b8;backdrop-filter:blur(4px)}.instruction:after{position:absolute;bottom:-8px;left:50%;width:14px;height:14px;content:"";border-right:1px solid #dec58e;border-bottom:1px solid #dec58e;background:#fff8e9;transform:translateX(-50%) rotate(45deg)}
    .action-panel{position:absolute;z-index:5;right:0;bottom:max(20px,env(safe-area-inset-bottom));left:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}.wish-chip{max-width:min(90vw,680px);padding:8px 14px;color:#fff4d6;border:1px solid #e1c38388;border-radius:999px;background:#122c2dcc;text-align:center;font-size:.82rem}.action-button{min-width:180px;min-height:58px;color:#fff7e5;border:2px solid #dfbd73;border-radius:999px;background:linear-gradient(#a34335,#702c28);box-shadow:0 5px 0 #4b261f,0 10px 22px #081a1c66;font-weight:900;font-size:1.2rem;cursor:pointer}.action-button:active{transform:translateY(3px);box-shadow:0 2px 0 #4b261f}.secondary-action{padding:6px 12px;color:#fff1d0;border:0;border-radius:999px;background:#102b2b99;text-decoration:underline;cursor:pointer}.complete-banner{position:absolute;z-index:8;top:40%;left:50%;padding:18px 30px;transform:translate(-50%,-50%);border:2px solid #ffe1a0;border-radius:16px;background:#7e3329ed;color:#fff6dc;font-family:serif;font-size:clamp(1.6rem,6vw,3rem);letter-spacing:.15em;box-shadow:0 8px 28px #071512aa;animation:appear .5s ease-out}.complete-banner[hidden]{display:none}@keyframes appear{from{opacity:0;transform:translate(-50%,-42%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    .feedback{position:absolute;z-index:7;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 142px);left:50%;width:min(92vw,520px);padding:10px 14px;transform:translateX(-50%);border-radius:12px;background:#122c2dde;color:#fff4dc;text-align:center;font-weight:750;box-shadow:0 4px 14px #07151266}.feedback[hidden]{display:none}.feedback.good{color:#efffdb}.feedback.miss{color:#ffe1bd}
      .game.pose-bow .shrine{transform:translateX(-50%) translateY(12px) translateZ(90px) scale(1.03)}.game.pose-bow .approach{transform:translateX(-50%) perspective(900px) rotateX(36deg) translateY(8px) translateZ(30px) scale(1.05,1.05)}.game.pose-bow .lantern.one{transform:translateY(10px) translateZ(22px)}.game.pose-bow .lantern.two{transform:translateY(10px) translateZ(12px) scale(.78)}.game.camera-bow .world{transform-origin:50% 62%;animation:camera-nod .72s ease-in-out}.game.camera-bow .shrine{animation:shrine-nod .72s ease-in-out}.game.camera-bow .approach{animation:path-nod .72s ease-in-out}.game.camera-bow .lantern{animation:lantern-nod .72s ease-in-out}.game.clap-action .hands{filter:drop-shadow(0 0 18px #ffe3ad)}@keyframes camera-nod{0%,100%{transform:rotateX(0) translateY(0) scale(1)}40%{transform:rotateX(2.5deg) translateY(8px) scale(1.02)}}@keyframes shrine-nod{0%,100%{transform:translateX(-50%) translateY(12px) translateZ(90px) scale(1.03)}40%{transform:translateX(-50%) translateY(28px) translateZ(70px) scale(1.07)}}@keyframes path-nod{0%,100%{transform:translateX(-50%) perspective(900px) rotateX(36deg) translateY(8px) translateZ(30px) scale(1.05,1.05)}40%{transform:translateX(-50%) perspective(900px) rotateX(40deg) translateY(24px) translateZ(34px) scale(1.09,1.08)}}@keyframes lantern-nod{0%,100%{filter:brightness(1)}40%{filter:brightness(1.2)}}@keyframes clap-left{0%,100%{transform:translateX(-6%) rotate(0)}38%,53%{transform:translateX(18%) rotate(1.5deg)}72%{transform:translateX(10%) rotate(-.5deg)}}@keyframes clap-right{0%,100%{transform:translateX(6%) rotate(0)}38%,53%{transform:translateX(-18%) rotate(-1.5deg)}72%{transform:translateX(-10%) rotate(.5deg)}}
    @media(max-width:640px){.top-caption{top:68px}.shrine{top:19%;width:86vw;height:30vh;min-height:160px}.approach{top:44%;width:95vw}.rail{top:47%}.timing-ring{width:clamp(120px,36vw,158px)}.instruction{top:24%;width:86vw;font-size:.9rem}.first-person{height:39%;bottom:-5%}.hands{width:min(92vw,480px)}.hand-art{filter:drop-shadow(0 5px 9px #18252255)}.wish-overlay{padding:10px}.question-card{max-height:calc(100dvh - 20px);padding:18px}.answer-list{grid-template-columns:1fr 1fr;gap:7px}.answer{min-height:58px;padding:9px;font-size:.83rem}.question-card>p{font-size:.88rem;margin-bottom:12px}.action-panel{bottom:max(12px,env(safe-area-inset-bottom));gap:7px}.action-button{min-height:54px}.feedback{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 126px)}.audio-tools{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left))}.audio-toggle{width:40px;height:40px}.complete-banner{top:43%}}
    @media(max-width:380px){.answer-list{grid-template-columns:1fr}.answer{min-height:46px}.question-card h1{font-size:1.45rem}.wish-chip{font-size:.74rem}}
    .answer{text-align:center}.quiz-progress{margin-top:18px;color:#887453;font-size:.85rem;text-align:right}.wish-reset{position:absolute;z-index:20;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:grid;place-items:center;width:48px;height:48px;padding:10px;color:#fff5dd;border:1px solid #f4d99d99;border-radius:50%;background:#7c3a32d9;box-shadow:0 3px 12px #07161455;cursor:pointer}.wish-reset[hidden]{display:none}.wish-reset svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.wish-reset:hover{background:#9b493b}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    /* Close view of the haiden from the worship position, just before the offertory box. */
    .scene{background:#173b3d}
    .scene:before{display:none}
    .worship-backdrop{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 57%;transform:scale(1.09);transform-origin:center 56%;filter:saturate(.94) brightness(.9);transition:transform .72s ease,filter .72s ease}
    .world>.sky-glow,.world>.garden,.world>.approach,.world>.rail,.world>.lantern,.world>.shrine{display:none!important}
    .game.pose-bow .worship-backdrop{transform:translateY(1%) scale(1.12);filter:saturate(.94) brightness(.86)}
    .game.camera-bow .world{transform-origin:50% 56%;animation:camera-nod .72s ease-in-out}
    @keyframes camera-nod{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(7px) scale(1.018)}70%{transform:translateY(2px) scale(1.006)}}
    @media(max-width:640px){.worship-backdrop{object-position:50% 57%;transform:scale(1.2)}.game.pose-bow .worship-backdrop{transform:translateY(1%) scale(1.23)}}
  </style>
</head>
<body>
  <main class="game" id="game">
    <div class="audio-tools" aria-label="音效設定">
      <button class="audio-toggle" id="effects-toggle" type="button" aria-label="切換參拜音效" aria-pressed="true" title="參拜音效：開">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11"/><path class="off-mark" d="m16 10 5 5m0-5-5 5"/></svg>
      </button>
      <button class="audio-toggle" id="prompt-toggle" type="button" aria-label="切換操作提示音" aria-pressed="true" title="操作提示音：開">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/><path class="off-mark" d="m16 10 5 5m0-5-5 5"/></svg>
      </button>
    </div>
    <div class="scene" id="scene" aria-label="參拜者站在拜殿前的第一人稱視角">
      <div class="world">
        <img class="worship-backdrop" src="haiden-worship-view.png" alt="" aria-hidden="true">
        <div class="sky-glow"></div><div class="garden left"></div><div class="garden right"></div><div class="approach"></div><div class="rail"></div>
        <div class="lantern one"></div><div class="lantern two"></div>

  <script>
    (()=>{
      const answers={category:null,goal:null,mood:null};
      const recommendations={
        program:{solve:['Debug 順利，錯誤一眼找到','願你拆解問題時思路清楚，逐步找到程式出錯的地方。'],succeed:['程式一次 AC，測資全都通過','願你準備的每個細節都派上用場，程式順利通過測試。'],protect:['程式碼與檔案都有備份','願重要版本妥善保存，修改時也能安心嘗試。'],steady:['寫程式時靈感清楚、思路穩定','願你一步一步完成想法，遇到卡關也能慢慢理出頭緒。']},
        online:{protect:['不遇到釣魚連結和假客服','願你看清網址與訊息來源，重要帳號都能平安無虞。'],solve:['遇到網路問題時，順利找出原因','願你分辨連線、設定與設備狀況，快速找到解法。'],succeed:['帳號安全，重要資料都妥善保管','願每次登入都安心，重要資料也有可靠的保護。'],steady:['網路使用平安順利','願你安心瀏覽、聯絡與分享，不被可疑訊息打擾。']},
        info:{solve:['查資料順利，找到可靠來源','願你很快找到有根據的資料，想確認的事情都有線索。'],protect:['不被假消息與可疑內容誤導','願你看見關鍵線索，查證後再做判斷。'],succeed:['報告資料正確，表達清楚','願準備的內容有來源、脈絡清晰，順利傳達給聽眾。'],steady:['AI 回答有根據，查證都順利','願工具提供好線索，也願你找到可信資料確認答案。']},
        device:{solve:['設備問題順利排除','願你找出問題所在，電腦、手機與周邊都恢復正常。'],protect:['重要檔案都有備份，不怕遺失','願資料有多一份可靠副本，設備狀況改變時也能安心。'],succeed:['投影、音響和網路一次就緒','願簡報設備配合順利，重要時刻一切準備妥當。'],steady:['網路穩定，設備運作順暢','願視訊、遊戲與日常工作都順暢，不被突發狀況打斷。']},
        school:{solve:['考試時思路清楚，題目順利解開','願你讀懂題意、找對方法，把平時準備的實力發揮出來。'],protect:['報告與作業都能妥善保存','願檔案版本清楚、資料完整，重要成果不會遺失。'],succeed:['報告順利，投影與音響一次成功','願準備充分、表達順暢，台下也聽得清楚。'],steady:['考試與校園安排都順利','願時間安排得宜，每件重要的事都能從容完成。']},
        daily:{solve:['待辦事情逐項完成','願眼前的問題一件件理清，重要安排都有好的進展。'],protect:['重要帳號與檔案都平安','願生活中的數位資料受到妥善照顧，需要時都找得到。'],succeed:['今天的計畫順利完成','願努力有好成果，留一點餘裕給意外的小插曲。'],steady:['日常平安，重要安排順心','願今天步調安穩，想做的事都能找到合適的時機。']}
      };
      const steps=[
        {pose:'bow',label:'第一拜',instruction:'等縮小的圓進入兩道內圈之間，再點擊畫面完成一拜。',button:'一拜'},
        {pose:'bow',label:'第二拜',instruction:'等縮小的圓進入兩道內圈之間，再點擊畫面。',button:'再拜'},

      ];
      const overlay=document.querySelector('#wish-overlay'),questionSteps=[...document.querySelectorAll('.question-step')],progress=document.querySelector('#quiz-progress'),ring=document.querySelector('#timing-ring'),shrinking=document.querySelector('#shrinking-ring'),instruction=document.querySelector('#instruction'),actionPanel=document.querySelector('#action-panel'),actionButton=document.querySelector('#action-button'),resetWishButton=document.querySelector('#back-to-questions'),feedback=document.querySelector('#feedback'),banner=document.querySelector('#complete-banner'),scene=document.querySelector('#scene'),hands=document.querySelector('#hands');
      let questionIndex=0,ritualIndex=0,animation=0,ringStarted=0,ringDuration=2400,ringRadius=88,selectedWish='',audio=null,effectsOn=true,promptOn=true,prayerTimer=0,birdTimer=0,actionTimer=0,locked=false,readyToStart=false,targetCuePlayed=false;
      function context(){if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}if(audio?.state==='suspended')audio.resume();return audio}
      function beep(freq=660,duration=.09,volume=.035){if(!promptOn)return;const ctx=context();if(!ctx)return;const oscillator=ctx.createOscillator(),gain=ctx.createGain();oscillator.frequency.value=freq;gain.gain.setValueAtTime(volume,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);oscillator.connect(gain).connect(ctx.destination);oscillator.start();oscillator.stop(ctx.currentTime+duration)}
      function effect(kind){if(!effectsOn)return;const ctx=context();if(!ctx)return;if(kind==='clap'){const size=Math.floor(ctx.sampleRate*.11),buffer=ctx.createBuffer(1,size,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<size;i++)data[i]=(Math.random()*2-1)*(1-i/size)**4;const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=buffer;filter.type='highpass';filter.frequency.value=850;gain.gain.value=.38;source.connect(filter).connect(gain).connect(ctx.destination);source.start()}else{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(880,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(520,ctx.currentTime+.6);gain.gain.setValueAtTime(.04,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.6);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.61)}}
      function birdChirp(){if(!effectsOn||!audio)return;const ctx=context();if(!ctx)return;const now=ctx.currentTime;[0,.15,.32].forEach((delay,i)=>{const oscillator=ctx.createOscillator(),gain=ctx.createGain();oscillator.type='sine';oscillator.frequency.setValueAtTime(2050+i*120,now+delay);oscillator.frequency.exponentialRampToValueAtTime(2850+i*150,now+delay+.08);gain.gain.setValueAtTime(.0001,now+delay);gain.gain.exponentialRampToValueAtTime(.012,now+delay+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.12);oscillator.connect(gain).connect(ctx.destination);oscillator.start(now+delay);oscillator.stop(now+delay+.13)})}
      function setToggle(button,on,label){button.setAttribute('aria-pressed',String(on));button.title=`${label}：${on?'開':'關'}`;button.setAttribute('aria-label',`切換${label}`)}
      function chosenGoal(){const scores={solve:0,protect:0,succeed:0,steady:0};scores[answers.goal]=(scores[answers.goal]??0)+2;const moodGoal={urgent:'succeed',curious:'solve',careful:'protect',ready:'succeed'}[answers.mood];scores[moodGoal]=(scores[moodGoal]??0)+1;return Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0]}
      function showQuestion(index){questionIndex=index;questionSteps.forEach((node,i)=>{node.hidden=i!==index;if(i<3)node.querySelectorAll('.answer').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.answer===answers[['category','goal','mood'][i]])))});progress.textContent=`第 ${index+1} 題 / 3`}
      function beginFromWish(){const choice=recommendations[answers.category]?.[chosenGoal()]??recommendations.daily.steady;selectedWish=choice[0];overlay.hidden=true;resetWishButton.hidden=false;actionPanel.hidden=false;actionButton.hidden=false;actionButton.disabled=false;actionButton.textContent='開始參拜';readyToStart=true;instruction.hidden=false;instruction.textContent='站在拜殿前，準備好就按「開始參拜」。';beep(880)}
      document.querySelector('.question-card').addEventListener('click',event=>{const button=event.target.closest('.answer');if(!button)return;const step=button.closest('.question-step'),index=Number(step.dataset.step),key=['category','goal','mood'][index];answers[key]=button.dataset.answer;step.querySelectorAll('.answer').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));beep(760,.07,.025);if(index<2)showQuestion(index+1);else beginFromWish()});
      const hitWindowOuter=58,hitWindowInner=28;
      function resetRing(){ringStarted=performance.now();ringDuration=2400;ringRadius=88;targetCuePlayed=false;shrinking.style.width='88%';shrinking.style.height='88%';ring.hidden=false}
      function renderStep(){if(ritualIndex>=steps.length){finish();return}const step=steps[ritualIndex],game=document.querySelector('#game');game.classList.remove('pose-bow','pose-clap','pose-pray','camera-bow','clap-action');game.classList.add(`pose-${step.pose}`);feedback.hidden=true;banner.hidden=true;instruction.hidden=false;ring.hidden=step.pose==='pray';if(step.pose==='pray'){instruction.textContent=`雙手合十，在心中默念：「${selectedWish}」`;actionButton.hidden=true;ring.hidden=true;locked=true;clearTimeout(prayerTimer);beep(520,.12);prayerTimer=setTimeout(()=>{ritualIndex++;locked=false;renderStep();animation=requestAnimationFrame(tick)},7000);return}actionButton.hidden=true;instruction.textContent=step.instruction;resetRing()}
      function tick(now){if(overlay.hidden&&!actionPanel.hidden&&!readyToStart){if(!ring.hidden){const elapsed=now-ringStarted,ratio=Math.max(0,1-elapsed/ringDuration);ringRadius=ratio*88;shrinking.style.width=`${ringRadius}%`;shrinking.style.height=`${ringRadius}%`;if(ringRadius<=hitWindowOuter&&!targetCuePlayed){targetCuePlayed=true;beep(1040,.07,.045)}if(ringRadius<hitWindowInner){failTiming();return}}animation=requestAnimationFrame(tick)} }
      function beginRitual(){context();readyToStart=false;ritualIndex=0;locked=false;actionButton.disabled=false;actionButton.hidden=false;instruction.hidden=false;instruction.textContent=steps[0].instruction;actionPanel.hidden=false;overlay.hidden=true;effect('bell');clearInterval(birdTimer);birdTimer=setInterval(birdChirp,7200);renderStep();cancelAnimationFrame(animation);animation=requestAnimationFrame(tick)}
      function failTiming(){if(locked)return;locked=true;cancelAnimationFrame(animation);ring.hidden=true;feedback.textContent='本次參拜不夠虔誠，請重新參拜。';feedback.className='feedback miss';feedback.hidden=false;actionPanel.hidden=true;instruction.hidden=true;setTimeout(()=>{ritualIndex=0;actionPanel.hidden=false;instruction.hidden=false;renderStep();locked=false;animation=requestAnimationFrame(tick)},1800)}
      function doAction(){if(locked||actionPanel.hidden||readyToStart)return;const step=steps[ritualIndex],game=document.querySelector('#game');if(!step||step.pose==='pray')return;if(ringRadius>hitWindowOuter){feedback.textContent='再等一下，等縮小的圓進入兩道內圈之間。';feedback.className='feedback';feedback.hidden=false;beep(320,.08);return}if(ringRadius<hitWindowInner){failTiming();return}locked=true;feedback.hidden=true;effect(step.pose==='clap'?'clap':'bell');beep(880,.07);if(step.pose==='bow')game.classList.add('camera-bow');else game.classList.add('clap-action');const transitionDelay=step.pose==='clap'&&ritualIndex===3?500:750;actionTimer=setTimeout(()=>{ritualIndex++;locked=false;renderStep();animation=requestAnimationFrame(tick)},transitionDelay)}
      function finish(){cancelAnimationFrame(animation);clearInterval(birdTimer);ring.hidden=true;instruction.hidden=true;feedback.hidden=true;banner.hidden=false;document.querySelector('#game').classList.remove('pose-bow','pose-clap');document.querySelector('#game').classList.add('pose-pray');actionPanel.hidden=false;actionButton.disabled=false;actionButton.hidden=false;actionButton.textContent='再參拜一次';readyToStart=true;effect('bell');beep(960,.18)}
      actionButton.addEventListener('click',()=>{if(readyToStart)beginRitual();else doAction()});
      document.querySelector('#game').addEventListener('click',event=>{if(!overlay.hidden||readyToStart||actionPanel.hidden||event.target.closest('.audio-tools,.action-panel,.wish-overlay,.feedback'))return;doAction()});
      resetWishButton.addEventListener('click',()=>{cancelAnimationFrame(animation);clearTimeout(prayerTimer);clearTimeout(actionTimer);clearInterval(birdTimer);readyToStart=false;locked=false;answers.category=null;answers.goal=null;answers.mood=null;selectedWish='';banner.hidden=true;feedback.hidden=true;ring.hidden=true;actionPanel.hidden=true;instruction.hidden=true;resetWishButton.hidden=true;document.querySelector('#game').classList.remove('pose-bow','pose-clap','pose-pray','camera-bow','clap-action');showQuestion(0);overlay.hidden=false});
      document.querySelector('#effects-toggle').addEventListener('click',event=>{effectsOn=!effectsOn;setToggle(event.currentTarget,effectsOn,'參拜音效');if(effectsOn)effect('bell')});
      document.querySelector('#prompt-toggle').addEventListener('click',event=>{promptOn=!promptOn;setToggle(event.currentTarget,promptOn,'操作提示音');if(promptOn)beep(780)});
      document.addEventListener('keydown',event=>{if((event.code==='Space'||event.code==='Enter')&&overlay.hidden&&!actionPanel.hidden){event.preventDefault();actionButton.click()}});
      setToggle(document.querySelector('#effects-toggle'),effectsOn,'參拜音效');setToggle(document.querySelector('#prompt-toggle'),promptOn,'操作提示音');showQuestion(0);
      window.addEventListener('pagehide',()=>{cancelAnimationFrame(animation);clearTimeout(prayerTimer);clearInterval(birdTimer);audio?.close()});
    })();
  </script>
<script>
  window.addEventListener('message', (event) => {
    const message = event.data;
    if (
      event.source !== window.parent ||
      !message ||
      message.type !== 'shrine-haiden:backdrop' ||
      typeof message.dataUrl !== 'string' ||
      !message.dataUrl.startsWith('data:image/png;base64,')
    ) return;

    const backdrop = document.querySelector('.worship-backdrop');
    if (backdrop instanceof HTMLImageElement) backdrop.src = message.dataUrl;
  });
</script>
</body>
